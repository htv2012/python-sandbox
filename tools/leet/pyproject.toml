[project]
name = "leet"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Hai Vu", email = "haivu2004@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "bs4>=0.0.2",
    "html2text>=2025.4.15",
    "requests>=2.34.2",
]

[project.scripts]
leet = "leet:main"

[build-system]
requires = ["uv_build>=0.9.21,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipython>=9.13.0",
    "jupyterlab>=4.5.7",
    "pytest>=9.0.3",
    "ruff>=0.15.14",
    "ty>=0.0.39",
]
