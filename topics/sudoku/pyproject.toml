[project]
name = "sudoku"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Hai Vu", email = "haivu2004@gmail.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
sudoku = "sudoku:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ipython>=9.0.2",
    "pytest>=9.1.1",
    "ruff>=0.11.2",
    "ty>=0.0.57",
]


[tool.pytest.ini_options]
log_cli = true
log_cli_level = "DEBUG"

